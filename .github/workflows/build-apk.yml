name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build signed APK with Gradle
        working-directory: android
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: arabic-accounting
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace 2>&1 | tee ../build-output.log
          echo "=== APK files found ==="
          find . -name "*.apk" | tee -a ../build-output.log

      - name: Copy signed APK
        run: |
          APK=$(find android -name "*.apk" | head -1)
          echo "APK found: $APK"
          cp "$APK" release-signed.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-v${{ github.run_number }}"
          gh release create "$TAG" ./release-signed.apk \
            --title "نظام محاسبة كروت الإنترنت — APK #${{ github.run_number }}" \
            --notes "ثبّت هذا الملف على جهاز أندرويد: اضغط عليه ثم اختر تثبيت." \
            --repo "${{ github.repository }}"

      - name: Save log on failure
        if: failure()
        run: |
          git config user.email "ci@local"
          git config user.name "CI Bot"
          mkdir -p logs
          cp build-output.log "logs/gradle-${{ github.run_number }}.log" 2>/dev/null || true
          git add logs/
          git diff --cached --quiet || git commit -m "CI: save gradle log #${{ github.run_number }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break || sleep 5
          done
