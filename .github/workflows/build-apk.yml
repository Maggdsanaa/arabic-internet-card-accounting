name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "twa-manifest.json"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Everything (SDK + Bubblewrap + Build), fully logged
        id: everything
        continue-on-error: true
        run: |
          exec > >(tee full-output.log) 2>&1

          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -f -sS -o cmdline-tools.zip https://dl.google.com/android/repo/commandlinetools-linux-15859902_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          cd "$GITHUB_WORKSPACE"
          npm install -g @bubblewrap/cli

          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << CFGEOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          CFGEOF

          printf '%s\n%s\n' "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | \
            bubblewrap build --skipPwaValidation

          APK_PATH=$(find "$GITHUB_WORKSPACE" -iname "*.apk" 2>/dev/null | head -1)
          echo "RESOLVED_APK_PATH=$APK_PATH"
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "$GITHUB_WORKSPACE/release-signed.apk"
          fi

      - name: Save full log to repo (always)
        if: always()
        run: |
          git config user.email "ci@local"
          git config user.name "CI Bot"
          mkdir -p logs
          cp full-output.log "logs/full-${{ github.run_number }}.log" 2>/dev/null || echo "no log produced" > "logs/full-${{ github.run_number }}.log"
          git add logs/
          git commit -m "CI: save full build log #${{ github.run_number }}" || echo "nothing to commit"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            echo "retry push $i"
            sleep 5
          done

      - name: Check APK was produced
        id: check
        run: |
          if [ -f "release-signed.apk" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release with APK
        if: steps.check.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-build-${{ github.run_number }}"
          gh release create "$TAG" ./release-signed.apk \
            --title "Android APK build #${{ github.run_number }}" \
            --notes "تطبيق أندرويد لنظام محاسبة كروت الإنترنت — تم بناؤه تلقائيًا." \
            --repo "${{ github.repository }}"

      - name: Fail job if no APK
        if: steps.check.outputs.found == 'false'
        run: |
          echo "Build did not produce an APK. See logs/full-${{ github.run_number }}.log in the repo."
          exit 1
