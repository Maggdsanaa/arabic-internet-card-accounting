name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "twa-manifest.json"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        id: sdk
        continue-on-error: true
        run: |
          set -e
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -f -s -o cmdline-tools.zip https://dl.google.com/android/repo/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          ls "$ANDROID_HOME"

      - name: Save SDK setup log on failure
        if: steps.sdk.outcome == 'failure'
        run: |
          git config user.email "ci@local"
          git config user.name "CI Bot"
          mkdir -p logs
          echo "SDK setup failed. HOME=$HOME" > "logs/sdk-${{ github.run_number }}.log"
          ls -la "$HOME/android-sdk/cmdline-tools" >> "logs/sdk-${{ github.run_number }}.log" 2>&1 || true
          curl -sI https://dl.google.com/android/repo/commandlinetools-linux-11076708_latest.zip >> "logs/sdk-${{ github.run_number }}.log" 2>&1 || true
          git add logs/
          git commit -m "CI: save sdk setup debug log #${{ github.run_number }}"
          git pull --rebase origin main && git push origin HEAD:main
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Pre-configure Bubblewrap (skip interactive wizard)
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF
          cat ~/.bubblewrap/config.json

      - name: Build signed APK
        id: build
        if: steps.sdk.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          printf '%s\n%s\n' "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > pw.txt
          bubblewrap build --skipPwaValidation < pw.txt > build-output.log 2>&1
          RC=$?
          tail -150 build-output.log
          exit $RC

      - name: Save build log on failure
        if: steps.build.outcome == 'failure'
        run: |
          git config user.email "ci@local"
          git config user.name "CI Bot"
          mkdir -p logs
          cp build-output.log "logs/build-${{ github.run_number }}.log"
          git add logs/
          git commit -m "CI: save failed build log #${{ github.run_number }}"
          git pull --rebase origin main && git push origin HEAD:main
          exit 1

      - name: Locate APK
        id: apk
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          APK_PATH=$(find "$(pwd)" -iname "*.apk" 2>/dev/null | head -1)
          echo "Found APK at: $APK_PATH"
          if [ -z "$APK_PATH" ]; then
            find "$(pwd)" -maxdepth 6 -type f > find-output.log 2>&1
            exit 1
          fi
          cp "$APK_PATH" ./release-signed.apk
          ls -la ./release-signed.apk

      - name: Save debug info if APK not found
        if: steps.apk.outcome == 'failure'
        run: |
          git config user.email "ci@local"
          git config user.name "CI Bot"
          mkdir -p logs
          echo "=== find output ===" > "logs/locate-${{ github.run_number }}.log"
          cat find-output.log >> "logs/locate-${{ github.run_number }}.log" 2>/dev/null
          echo "=== build output tail ===" >> "logs/locate-${{ github.run_number }}.log"
          tail -150 build-output.log >> "logs/locate-${{ github.run_number }}.log" 2>/dev/null
          git add logs/
          git commit -m "CI: save locate-apk debug log #${{ github.run_number }}"
          git pull --rebase origin main && git push origin HEAD:main
          exit 1

      - name: Create GitHub Release with APK
        id: release
        if: steps.build.outcome == 'success' && steps.apk.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          TAG="apk-build-${{ github.run_number }}"
          gh release create "$TAG" ./release-signed.apk \
            --title "Android APK build #${{ github.run_number }}" \
            --notes "تطبيق أندرويد لنظام محاسبة كروت الإنترنت — تم بناؤه تلقائيًا." \
            --repo "${{ github.repository }}" > release-output.log 2>&1
          RC=$?
          cat release-output.log
          exit $RC

      - name: Save release log on failure
        if: steps.release.outcome == 'failure'
        run: |
          git config user.email "ci@local"
          git config user.name "CI Bot"
          mkdir -p logs
          cp release-output.log "logs/release-${{ github.run_number }}.log" 2>/dev/null || echo "no release-output.log" > "logs/release-${{ github.run_number }}.log"
          git add logs/
          git commit -m "CI: save failed release log #${{ github.run_number }}"
          git pull --rebase origin main && git push origin HEAD:main
          exit 1
