name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "twa-manifest.json"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build signed APK
        id: build
        continue-on-error: true
        run: |
          printf '%s\n%s\n' "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | \
          bubblewrap build --skipPwaValidation 2>&1 | tee build-output.log

      - name: Save build log on failure
        if: steps.build.outcome == 'failure'
        run: |
          git config user.email "ci@local"
          git config user.name "CI Bot"
          mkdir -p logs
          cp build-output.log "logs/build-${{ github.run_number }}.log"
          git add logs/
          git commit -m "CI: save failed build log #${{ github.run_number }}"
          git push origin HEAD:main

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Locate APK
        id: apk
        if: steps.build.outcome == 'success'
        run: |
          APK_PATH=$(find "$(pwd)" -maxdepth 2 -iname "*.apk" | head -1)
          echo "Found APK at: $APK_PATH"
          ls -la "$(pwd)"/*.apk || true
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with APK
        id: release
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-build-${{ github.run_number }}"
          ls -la *.apk
          gh release create "$TAG" *.apk \
            --title "Android APK build #${{ github.run_number }}" \
            --notes "تطبيق أندرويد لنظام محاسبة كروت الإنترنت — تم بناؤه تلقائيًا." \
            --repo "${{ github.repository }}" 2>&1 | tee release-output.log

      - name: Save release log on failure
        if: steps.release.outcome == 'failure'
        run: |
          git config user.email "ci@local"
          git config user.name "CI Bot"
          mkdir -p logs
          cp release-output.log "logs/release-${{ github.run_number }}.log"
          git add logs/
          git commit -m "CI: save failed release log #${{ github.run_number }}"
          git push origin HEAD:main
          exit 1
